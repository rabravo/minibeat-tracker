<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MiniBeat HPC{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="/" class="logo">
      <span class="logo-icon">♡</span>
      <span class="logo-name">MiniBeat</span>
      <span class="logo-tag">HPC</span>
    </a>
    <nav>
      <a href="/">New job</a>
      <a href="/health" class="muted">Health</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <span class="muted">MiniBeat Tracker — cardiomyocyte motion analysis</span>
  </footer>
</body>
</html>
