name: minibeat-tracker
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26
  - scipy>=1.12
  - numba>=0.59
  - scikit-image>=0.22
  - opencv>=4.9
  - tifffile>=2024.1
  - joblib>=1.3
  - pandas>=2.2
  - matplotlib>=3.8
  - pyqt6               # conda-forge PyQt6 shares Qt6 libs with opencv — no duplicate dylibs
  - qtpy>=2.4
  - superqt>=0.6
  - pip
  - pip:
      - napari>=0.5         # no [all] — prevents pip from pulling a second Qt runtime
      - magicgui>=0.8
      - -e ./minibeat-tracker
